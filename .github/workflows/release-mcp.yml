name: Release MCP module

on:
  push:
    tags:
      - "v*.*.0"

permissions:
  contents: write

jobs:
  tag-mcp-module:
    name: Tag matching MCP module
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: mcp/go.sum

      - name: Validate and test MCP module
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.0$ ]]; then
            echo "unsupported release version: ${version}" >&2
            exit 1
          fi
          required_version="$(cd mcp && go list -m -f '{{if eq .Path "github.com/volcengine/ark-runtime-go"}}{{.Version}}{{end}}' all)"
          if [[ "${required_version}" != "v${version}" ]]; then
            echo "mcp requires core ${required_version}, want v${version}" >&2
            exit 1
          fi
          (cd mcp && go test ./...)

      - name: Publish MCP module tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          nested_tag="mcp/${RELEASE_TAG}"
          existing="$(git ls-remote origin "refs/tags/${nested_tag}" | cut -f1)"
          if [[ -n "${existing}" ]]; then
            if [[ "${existing}" != "${GITHUB_SHA}" ]]; then
              echo "${nested_tag} already points to ${existing}, want ${GITHUB_SHA}" >&2
              exit 1
            fi
            exit 0
          fi
          git tag "${nested_tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${nested_tag}"
